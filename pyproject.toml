[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-p2p"
version = "2.0.0"
authors = [
  { name="Idris Chakib" },
]
description = "Secure Distributed P2P Chat, Lamport Causality, File Transfer & Consensus System"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Distributed Computing",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "customtkinter>=5.2.0",
    "cryptography>=41.0.0",
    "packaging>=23.0",
]

[project.scripts]
nexus-p2p = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
