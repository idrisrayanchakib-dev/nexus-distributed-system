<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nexusBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Core Stroke Gradient -->
    <linearGradient id="nexusNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Node Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>

    <!-- Filter for subtle drop-shadow glow -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="100,18 172,59 172,141 100,182 28,141 28,59" 
           fill="url(#nexusBgGrad)" 
           stroke="url(#nexusNeonGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#neonShadow)"/>

  <!-- Inner Mesh Topology Lines -->
  <!-- Outer vertices to Center -->
  <line x1="100" y1="18" x2="100" y2="100" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="172" y1="59" x2="100" y2="100" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="172" y1="141" x2="100" y2="100" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="100" y1="182" x2="100" y2="100" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="28" y1="141" x2="100" y2="100" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="28" y1="59" x2="100" y2="100" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Inner Cross-connections (Full-Mesh Interlinks) -->
  <line x1="100" y1="18" x2="172" y2="141" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
  <line x1="172" y1="59" x2="28" y2="141" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>
  <line x1="28" y1="59" x2="100" y2="182" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.45"/>

  <!-- Central Dynamic Nexus Core (Diamond / Star) -->
  <polygon points="100,68 126,100 100,132 74,100" 
           fill="url(#coreGlow)" 
           opacity="0.9"
           filter="url(#neonShadow)"/>
  
  <polygon points="100,78 118,100 100,122 82,100" 
           fill="#ffffff" 
           opacity="0.95"/>

  <!-- Outer Interconnected Peer Nodes (Spheres) -->
  <circle cx="100" cy="18" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="172" cy="59" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="172" cy="141" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="100" cy="182" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="28" cy="141" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="28" cy="59" r="8" fill="url(#nodeGlow)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Center Core Node -->
  <circle cx="100" cy="100" r="5" fill="#ffffff" filter="url(#neonShadow)"/>
</svg>
